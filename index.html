<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Dash – Geometry Dash-style web game</title>
<style>
html,body{margin:0;height:100%;background:#05010f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,Arial,sans-serif;color:#fff}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;right:0;padding:10px 12px;display:flex;align-items:center;gap:10px;pointer-events:none}
#bar{flex:1;height:10px;border-radius:6px;background:#ffffff22;overflow:hidden;border:1px solid #ffffff44}
#fill{height:100%;width:0;background:linear-gradient(90deg,#0ff,#f0f)}
#pct{min-width:44px;text-align:right;font-weight:700;text-shadow:0 0 6px #0ff}
#att{position:fixed;top:30px;left:12px;font-size:13px;opacity:.8;pointer-events:none}
#menuBtn{pointer-events:auto;background:#ffffff18;border:1px solid #ffffff55;color:#fff;border-radius:8px;width:36px;height:30px;font-size:16px}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05010fcc;text-align:center;gap:14px;padding:20px}
.ov h1{margin:0;font-size:clamp(34px,9vw,64px);letter-spacing:2px;color:#fff;text-shadow:0 0 12px #0ff,0 0 28px #f0f}
.ov p{margin:0;opacity:.85;max-width:420px}
.btn{background:linear-gradient(90deg,#00e5ff,#ff2bd6);border:0;color:#05010f;font-weight:800;font-size:20px;padding:14px 34px;border-radius:12px;cursor:pointer}
.btn2{background:#ffffff18;border:1px solid #ffffff66;color:#fff;font-size:15px;padding:10px 20px;border-radius:10px;cursor:pointer}
.hide{display:none!important}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="bar"><div id="fill"></div></div><div id="pct">0%</div><button id="menuBtn" aria-label="menu">☰</button></div>
<div id="att">Attempt 1</div>
<div id="start" class="ov"><h1>NEON DASH</h1><p>Tap, click or press Space to jump. Hold to keep jumping. Hit yellow pads and orbs mid-air. Reach 100%!</p>
<button class="btn" id="playBtn">▶ PLAY</button><button class="btn2" id="pracBtn">Practice mode (checkpoints)</button></div>
<div id="menu" class="ov hide"><h1 style="font-size:36px">PAUSED</h1><button class="btn" id="resBtn">Resume</button><button class="btn2" id="togPrac">Practice: off</button><button class="btn2" id="muteBtn">Sound: on</button><button class="btn2" id="restartBtn">Restart level</button></div>
<div id="win" class="ov hide"><h1>LEVEL COMPLETE!</h1><p id="winTxt"></p><button class="btn" id="againBtn">Play again</button></div>
<script>
"use strict";
const BUILD="neon-dash-v1";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,T; // T = tile px
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);T=Math.max(22,Math.min(48,H/12,W/14));}
addEventListener('resize',resize);resize();

// ---------- Level (tile units, y up from ground) ----------
const SPEED=10.4, G=88, JV=19.2, PADV=27, ORBV=20;
const BPM=128, BEAT=60/BPM;
const L=[]; // {t:type,x,y,w,h}
const sp=(x,y=0)=>L.push({t:'s',x,y,w:1,h:1});
const bl=(x,y=0,w=1,h=1)=>L.push({t:'b',x,y,w,h});
const pad=(x,y=0)=>L.push({t:'p',x,y,w:1,h:.3});
const orb=(x,y)=>L.push({t:'o',x,y,w:1,h:1});
let x=18;
// Section 1: intro singles
for(let i=0;i<6;i++){sp(x);x+=10;}
sp(x);sp(x+1);x+=12;sp(x);sp(x+1);x+=12;
// Section 2: blocks and steps
bl(x,0,3,1);sp(x+5);bl(x+7,0,3,2);bl(x+10,0,1,1);x+=16;
for(let i=0;i<4;i++){bl(x,0,2,1+i%2*1);sp(x+2);sp(x+3);x+=7;}
x+=4;sp(x);sp(x+1);sp(x+2);x+=10;
// Section 3: pads
pad(x);sp(x+3);sp(x+4);sp(x+5);sp(x+6);x+=14;
pad(x);bl(x+6,2,4,1);sp(x+9,3);x+=14;
for(let i=0;i<3;i++){sp(x);x+=5;sp(x);sp(x+1);x+=8;}
// Section 4: platforms over spike pits
bl(x,0,3,1);for(let i=3;i<15;i++)sp(x+i);bl(x+6,2,3,1);bl(x+12,3,3,1);bl(x+15,0,3,1);x+=24;
// Section 5: orbs
sp(x);sp(x+1);sp(x+2);orb(x+2,2.3);sp(x+3);sp(x+4);sp(x+5);sp(x+6);x+=14;
for(let i=0;i<3;i++){sp(x);sp(x+1);sp(x+2);orb(x+2,2.2);sp(x+3);sp(x+4);sp(x+5);x+=13;}
x+=4;
// Section 6: staircase
for(let i=0;i<5;i++){bl(x+i*3,0,3,i+1);} for(let i=0;i<5;i++)sp(x+15+i);bl(x+18,2,4,1);x+=28;
// Section 7: rhythm doubles
for(let i=0;i<6;i++){sp(x);if(i%2)sp(x+1);x+=i%3==2?9:7;}
// Section 8: tunnel ceiling
bl(x,0,20,1);for(let i=0;i<4;i++)sp(x+4+i*4,1);bl(x,5,20,1);x+=26;
// Section 9: pad + orb chain
pad(x);for(let i=1;i<20;i++)sp(x+i);orb(x+8,3.6);orb(x+14,3);bl(x+20,0,3,1);x+=28;
// Section 9b: mid-break + block hops
x+=6;for(let i=0;i<6;i++){bl(x,0,2,1+(i%3));sp(x+3);x+=8;}
// Section 9c: orb ladder
for(let i=0;i<4;i++){sp(x);sp(x+1);sp(x+2);orb(x+2,2.2);sp(x+3);sp(x+4);sp(x+5);x+=11;}
// Section 9d: floating platforms with pads
pad(x);for(let i=1;i<18;i++)sp(x+i);bl(x+6,3,3,1);bl(x+12,3,3,1);bl(x+18,0,3,1);x+=26;
for(let i=0;i<8;i++){sp(x);if(i%3==1)sp(x+1);x+=7;}
// Section 10: finale gauntlet
for(let i=0;i<5;i++){bl(x,0,2,1);sp(x+2);sp(x+3);bl(x+4,0,2,2);sp(x+6);sp(x+7);x+=12;}
pad(x);sp(x+2);sp(x+3);sp(x+4);sp(x+5);sp(x+6);x+=12;
for(let i=0;i<4;i++){sp(x);sp(x+1);x+=6;}
x+=8;
const LEVEL_END=x+6;
const DURATION=LEVEL_END/SPEED;

// ---------- State ----------
let P,attempts=1,state='start',practice=false,checkpoints=[],dead=0,parts=[],camX=0,best=0,holding=false,orbUsed=new Set(),levelTime=0,paused=false;
function reset(){
  const cp=practice&&checkpoints.length?checkpoints[checkpoints.length-1]:null;
  P=cp?{...cp}:{x:0,y:0,vy:0,rot:0,ground:true};
  orbUsed=new Set();parts=parts.filter(p=>p.k);dead=0;
  levelTime=P.x/SPEED; startMusic(levelTime);
}
// ---------- Audio ----------
let AC=null,master=null,muted=false,musicT0=0,nextBeat=0,schedTimer=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.35;master.connect(AC.destination);}catch(e){}}
function noiseBuf(){const b=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
let NB=null;
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(master);o.start(t);o.stop(t+.26);}
function hat(t,v=.25,len=.05){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+len+.01);}
function snare(t){hat(t,.5,.18);const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=190;g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g);g.connect(master);o.start(t);o.stop(t+.12);}
function tone(t,f,len,type='sawtooth',v=.12){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1800;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(fl);fl.connect(g);g.connect(master);o.start(t);o.stop(t+len+.02);}
const ROOTS=[45,41,48,43]; const mf=n=>440*Math.pow(2,(n-69)/12);
const ARP=[0,7,12,15,12,7,3,7];
function playStep(i,t){ // i = 16th-note index
  const bar=Math.floor(i/16),s=i%16,sec=Math.floor(bar/8),root=ROOTS[Math.floor(bar/2)%4];
  if(s%4==0)kick(t);
  if(s==4||s==12){if(sec>0)snare(t);}
  if(s%2==1)hat(t,.15);
  if(s%4==2)tone(t,mf(root-12),.18,'square',.13);
  if(sec>=1)tone(t,mf(root+12+ARP[s%8]),.12,'sawtooth',sec>=3?.07:.05);
  if(sec>=2&&s==0)tone(t,mf(root+24),BEAT*3.5,'triangle',.05);
}
function startMusic(fromSec){
  if(!AC)return; if(AC.state==='suspended')AC.resume();
  clearInterval(schedTimer);
  const step=BEAT/4; let idx=Math.ceil(fromSec/step); musicT0=AC.currentTime+.05-fromSec;
  nextBeat=idx;
  schedTimer=setInterval(()=>{if(muted||paused||state!=='play'||dead)return;
    while(musicT0+nextBeat*step<AC.currentTime+.12){const t=musicT0+nextBeat*step;if(t>=AC.currentTime-.02)playStep(nextBeat,t);nextBeat++;}},25);
}
function sfxDie(){if(!AC||muted)return;const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=NB;const g=AC.createGain();g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);s.connect(g);g.connect(master);s.start(t);s.stop(t+.4);}

// ---------- Input ----------
function press(){initAudio();if(AC&&!NB)NB=noiseBuf();holding=true;if(state==='play'&&!paused)tryJump(true);}
function release(){holding=false;}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat)press();}
  if(e.code==='Escape'||e.code==='KeyP')togglePause();
  if(e.code==='KeyZ'&&practice&&state==='play')placeCP();});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')release();});
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});
addEventListener('pointerup',release);addEventListener('pointercancel',release);
let jumpBuffered=false;
function tryJump(fresh){
  if(dead)return;
  // orbs
  for(const o of L)if(o.t==='o'&&!orbUsed.has(o)&&fresh&&Math.abs(o.x+.5-(P.x+.5))<1.1&&Math.abs(o.y+.5-(P.y+.5))<1.2){orbUsed.add(o);P.vy=ORBV;P.ground=false;burst(o.x+.5,o.y+.5,'#ff0',10);return;}
  if(P.ground){P.vy=JV;P.ground=false;}
}
function placeCP(){if(P.ground)checkpoints.push({...P});}

// ---------- Particles ----------
function burst(x,y,c,n,sp=8){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6+Math.random()*.5,c,s:.12+Math.random()*.2});}}

// ---------- Update ----------
function die(){if(dead)return;dead=performance.now();sfxDie();burst(P.x+.5,P.y+.5,'#0ff',40,14);burst(P.x+.5,P.y+.5,'#f0f',25,10);clearInterval(schedTimer);
  setTimeout(()=>{if(state!=='play')return;attempts++;updAtt();reset();},650);}
function updAtt(){document.getElementById('att').textContent='Attempt '+attempts+(practice?' · practice':'');}
function update(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=12*dt;p.l-=dt;}parts=parts.filter(p=>p.l>0);
  if(state!=='play'||paused||dead)return;
  levelTime+=dt;
  const px0=P.x,py0=P.y;
  P.x+=SPEED*dt;
  P.vy-=G*dt; if(P.vy<-40)P.vy=-40;
  P.y+=P.vy*dt;
  P.ground=false;
  if(P.y<=0){P.y=0;P.vy=0;P.ground=true;}
  for(const o of L){
    if(o.x>P.x+2)break;
    if(o.x+o.w<P.x-1)continue;
    if(o.t==='b'){
      if(P.x+1>o.x&&P.x<o.x+o.w&&P.y<o.y+o.h&&P.y+1>o.y){
        if(py0>=o.y+o.h-.35&&P.vy<=0){P.y=o.y+o.h;P.vy=0;P.ground=true;}
        else if(py0+1<=o.y+.25&&P.vy>0){die();return;} // head bonk = die (GD style)
        else {die();return;}
      }
    } else if(o.t==='s'){
      if(P.x+.8>o.x+.35&&P.x+.2<o.x+.65&&P.y+.15<o.y+.6&&P.y+.85>o.y+.05){die();return;}
    } else if(o.t==='p'){
      if(P.x+1>o.x&&P.x<o.x+1&&P.y<o.y+.4&&P.vy<=0){P.vy=PADV;P.ground=false;burst(o.x+.5,o.y+.3,'#ff0',12);}
    }
  }
  if(P.ground){P.rot=Math.round(P.rot/(Math.PI/2))*(Math.PI/2);if(holding)tryJump(false);}
  else P.rot+=dt*Math.PI*1.9*Math.sign(SPEED);
  if(Math.random()<.5&&P.ground)parts.push({x:P.x,y:P.y+.1,vx:-2,vy:1+Math.random(),l:.3,c:'#0ff',s:.12});
  const pc=Math.min(100,P.x/LEVEL_END*100);best=Math.max(best,pc);
  document.getElementById('fill').style.width=pc+'%';document.getElementById('pct').textContent=Math.floor(pc)+'%';
  if(P.x>=LEVEL_END){state='win';clearInterval(schedTimer);document.getElementById('winTxt').textContent=`Completed in ${attempts} attempt${attempts>1?'s':''}${practice?' (practice)':''}.`;document.getElementById('win').classList.remove('hide');}
}

// ---------- Render ----------
const hue=()=>(200+ (camX/LEVEL_END)*140)%360;
function sx(x){return (x-camX)*T+W*.28;}
function groundY(){return H*.72;}
function sy(y){return groundY()-y*T;}
function render(now){
  const pulse=AC&&state==='play'&&!dead?Math.max(0,1-(((AC.currentTime-musicT0)%BEAT)/BEAT)*3):0;
  if(P&&!dead)camX=P.x;
  const h=hue();
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`hsl(${h},70%,${10+pulse*4}%)`);g.addColorStop(1,`hsl(${(h+60)%360},80%,6%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // parallax layer 1: stars
  ctx.fillStyle='#ffffff88';for(let i=0;i<60;i++){const xx=((i*137.5-camX*T*.05)%W+W)%W,yy=(i*71)%(groundY()*.9);ctx.fillRect(xx,yy,2,2);}
  // layer 2: far squares
  for(let i=0;i<14;i++){const s=T*(2+i%3);const xx=((i*W/6-camX*T*.2)%(W+s*2)+W+s*2)%(W+s*2)-s;const yy=groundY()*.25+(i*53)%(groundY()*.5);
    ctx.strokeStyle=`hsla(${(h+40)%360},90%,60%,.18)`;ctx.lineWidth=2;ctx.strokeRect(xx,yy,s,s);}
  // layer 3: city
  ctx.fillStyle=`hsla(${(h+20)%360},70%,18%,.9)`;for(let i=0;i<20;i++){const w=T*2.5,bh=T*(2+(i*7)%5);const xx=((i*w*1.3-camX*T*.45)%(W+w*2)+W+w*2)%(W+w*2)-w;ctx.fillRect(xx,groundY()-bh,w,bh);}
  // ground
  ctx.fillStyle=`hsl(${h},60%,10%)`;ctx.fillRect(0,groundY(),W,H-groundY());
  ctx.strokeStyle=`hsl(${h},100%,70%)`;ctx.lineWidth=3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=12+pulse*10;
  ctx.beginPath();ctx.moveTo(0,groundY());ctx.lineTo(W,groundY());ctx.stroke();ctx.shadowBlur=0;
  ctx.strokeStyle=`hsla(${h},100%,70%,.15)`;ctx.lineWidth=1;for(let i=0;i<W/T+2;i++){const xx=((i*T*2-camX*T)%(T*2)+T*2)%(T*2)+i*T*2-T*2;if(xx>W)break;ctx.beginPath();ctx.moveTo(xx,groundY());ctx.lineTo(xx-T,H);ctx.stroke();}
  // objects
  const minX=camX-W*.28/T-2,maxX=camX+W/T;
  for(const o of L){if(o.x+o.w<minX)continue;if(o.x>maxX)break;
    const X=sx(o.x),Y=sy(o.y);
    if(o.t==='b'){ctx.fillStyle='#0a0420';ctx.fillRect(X,Y-o.h*T,o.w*T,o.h*T);ctx.strokeStyle=`hsl(${(h+180)%360},100%,65%)`;ctx.lineWidth=2;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=8;ctx.strokeRect(X+1,Y-o.h*T+1,o.w*T-2,o.h*T-2);ctx.shadowBlur=0;
      ctx.strokeStyle=`hsla(${(h+180)%360},100%,65%,.25)`;for(let i=0;i<o.w;i++)for(let j=0;j<o.h;j++)ctx.strokeRect(X+i*T+5,Y-(j+1)*T+5,T-10,T-10);}
    else if(o.t==='s'){ctx.beginPath();ctx.moveTo(X+2,Y);ctx.lineTo(X+T/2,Y-T*.95);ctx.lineTo(X+T-2,Y);ctx.closePath();ctx.fillStyle='#120018';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.shadowColor='#f36';ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;}
    else if(o.t==='p'){ctx.fillStyle='#ffe600';ctx.shadowColor='#ff0';ctx.shadowBlur=14;ctx.beginPath();ctx.ellipse(X+T/2,Y-T*.12,T*.45,T*.15,0,Math.PI,0);ctx.fill();ctx.shadowBlur=0;}
    else if(o.t==='o'){const used=orbUsed.has(o);const r=T*.32*(1+.12*Math.sin(now/120));ctx.strokeStyle=used?'#886':'#ff0';ctx.lineWidth=3;ctx.shadowColor='#ff0';ctx.shadowBlur=used?0:16;ctx.beginPath();ctx.arc(X+T/2,Y-T/2,r,0,7);ctx.stroke();ctx.fillStyle=used?'#443':'#ffe60088';ctx.beginPath();ctx.arc(X+T/2,Y-T/2,r*.6,0,7);ctx.fill();ctx.shadowBlur=0;}
  }
  // end portal
  {const X=sx(LEVEL_END);if(X<W+40){ctx.strokeStyle='#0f8';ctx.lineWidth=4;ctx.shadowColor='#0f8';ctx.shadowBlur=20;ctx.strokeRect(X,sy(6),T*.6,T*6);ctx.shadowBlur=0;}}
  // checkpoints
  for(const c of checkpoints){const X=sx(c.x),Y=sy(c.y);ctx.fillStyle='#0f8';ctx.beginPath();ctx.moveTo(X+T/2,Y-T*1.6);ctx.lineTo(X+T*.8,Y-T*1.2);ctx.lineTo(X+T/2,Y-T*.8);ctx.lineTo(X+T*.2,Y-T*1.2);ctx.fill();}
  // particles
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.l*2));ctx.fillStyle=p.c;ctx.fillRect(sx(p.x)-p.s*T/2,sy(p.y)-p.s*T/2,p.s*T,p.s*T);}ctx.globalAlpha=1;
  // player cube
  if(P&&!dead&&state!=='start'||state==='start'&&P){const X=sx(P.x)+T/2,Y=sy(P.y)-T/2;ctx.save();ctx.translate(X,Y);ctx.rotate(P.rot);
    const s=T*(1+pulse*.06);ctx.shadowColor='#0ff';ctx.shadowBlur=18;ctx.fillStyle='#00e5ff';ctx.fillRect(-s/2,-s/2,s,s);ctx.shadowBlur=0;
    ctx.fillStyle='#ff2bd6';ctx.fillRect(-s*.32,-s*.32,s*.64,s*.64);ctx.fillStyle='#00e5ff';ctx.fillRect(-s*.18,-s*.18,s*.36,s*.36);
    ctx.strokeStyle='#05010f';ctx.lineWidth=2;ctx.strokeRect(-s/2,-s/2,s,s);ctx.restore();}
  if(dead){ctx.fillStyle=`rgba(255,255,255,${Math.max(0,.35-(now-dead)/600)})`;ctx.fillRect(0,0,W,H);}
}
let last=performance.now();
function loop(now){const dt=Math.min(1/30,(now-last)/1000);last=now;
  // sub-step for robust collisions
  const n=3;for(let i=0;i<n;i++)update(dt/n);
  render(now);requestAnimationFrame(loop);}
P={x:0,y:0,vy:0,rot:0,ground:true};
requestAnimationFrame(loop);

// ---------- UI ----------
const $=id=>document.getElementById(id);
function begin(pr){practice=pr;checkpoints=[];attempts=1;updAtt();initAudio();if(AC&&!NB)NB=noiseBuf();$('start').classList.add('hide');$('win').classList.add('hide');state='play';paused=false;holding=false;reset();refreshMenu();}
$('playBtn').onclick=()=>begin(false);$('pracBtn').onclick=()=>begin(true);$('againBtn').onclick=()=>begin(practice);
function togglePause(){if(state!=='play')return;paused=!paused;$('menu').classList.toggle('hide',!paused);if(!paused)startMusic(levelTime);else clearInterval(schedTimer);}
$('menuBtn').onclick=e=>{e.stopPropagation();togglePause();};$('menuBtn').onpointerdown=e=>e.stopPropagation();
$('resBtn').onclick=togglePause;
function refreshMenu(){$('togPrac').textContent='Practice: '+(practice?'on':'off');$('muteBtn').textContent='Sound: '+(muted?'off':'on');}
$('togPrac').onclick=()=>{practice=!practice;checkpoints=[];refreshMenu();updAtt();};
$('muteBtn').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.35;refreshMenu();};
$('restartBtn').onclick=()=>{checkpoints=[];attempts++;updAtt();paused=false;$('menu').classList.add('hide');reset();};
// practice: auto checkpoint every ~4s on ground
setInterval(()=>{if(practice&&state==='play'&&!paused&&!dead&&P.ground&&(!checkpoints.length||P.x-checkpoints[checkpoints.length-1].x>35))placeCP();},300);
window.__game={get P(){return P},LEVEL_END,DURATION,BUILD};
