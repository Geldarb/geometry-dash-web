<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grimoire Dash – a rhythm runner</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet"><style>
html,body{margin:0;height:100%;background:#0b0607;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Cinzel','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;color:#fff}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;right:0;padding:10px 12px;display:flex;align-items:center;gap:10px;pointer-events:none}
#bar{flex:1;height:10px;border-radius:6px;background:#f4e4bc22;overflow:hidden;border:1px solid #d4a437}
#fill{height:100%;width:0;background:linear-gradient(90deg,#8a1020,#d4a437)}
#pct{min-width:44px;text-align:right;font-weight:700;color:#f3d27a;text-shadow:0 0 6px #d4a437}
#att{position:fixed;top:30px;left:12px;font-size:13px;color:#f3d27a;opacity:.8;pointer-events:none}
#menuBtn{pointer-events:auto;background:#f4e4bc22;border:1px solid #d4a437;color:#f3d27a;border-radius:8px;width:36px;height:30px;font-size:16px}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#3a0d12ee,#0b0607f2);text-align:center;gap:14px;padding:20px}
.ov h1{margin:0;font-size:clamp(34px,9vw,64px);letter-spacing:2px;color:#fff;color:#f3d27a;text-shadow:0 2px 0 #5a3a10,0 0 18px #e0192e}
.ov p{margin:0;opacity:.85;max-width:420px}
.btn{background:linear-gradient(#f4e4bc,#d9c08a);border:2px solid #d4a437;color:#2a1405;box-shadow:0 0 14px #d4a43788;font-family:inherit;font-weight:800;font-size:20px;padding:14px 34px;border-radius:12px;cursor:pointer}
.btn2{background:#f4e4bc22;border:1px solid #d4a437;color:#f3d27a;font-family:inherit;font-size:15px;padding:10px 20px;border-radius:10px;cursor:pointer}
.hide{display:none!important}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="bar"><div id="fill"></div></div><div id="pct">0%</div><button id="menuBtn" aria-label="menu">☰</button></div>
<div id="att">Attempt 1</div>
<div id="start" class="ov"><h1>GRIMOIRE DASH</h1><p>Tap, click or press Space to jump. Hold to keep jumping. Golden runes launch you; tap glowing mana orbs mid-air. Dodge the anti-magic thorns. Reach 100%!</p>
<button class="btn" id="playBtn">▶ PLAY</button><button class="btn2" id="pracBtn">Practice mode (checkpoints)</button></div>
<div id="menu" class="ov hide"><h1 style="font-size:36px">PAUSED</h1><button class="btn" id="resBtn">Resume</button><button class="btn2" id="togPrac">Practice: off</button><button class="btn2" id="muteBtn">Sound: on</button><button class="btn2" id="restartBtn">Restart level</button></div>
<div id="win" class="ov hide"><h1>LEVEL COMPLETE!</h1><p id="winTxt"></p><button class="btn" id="againBtn">Play again</button></div>
<script>
"use strict";
const BUILD="grimoire-dash-v2";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,T; // T = tile px
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);T=Math.max(22,Math.min(48,H/12,W/14));}
addEventListener('resize',resize);resize();

// ---------- Level (tile units, y up from ground) ----------
const SPEED=10.4, G=88, JV=19.2, PADV=27, ORBV=20;
const BPM=128, BEAT=60/BPM;
const L=[]; // {t:type,x,y,w,h}
const sp=(x,y=0)=>L.push({t:'s',x,y,w:1,h:1});
const bl=(x,y=0,w=1,h=1)=>L.push({t:'b',x,y,w,h});
const pad=(x,y=0)=>L.push({t:'p',x,y,w:1,h:.3});
const orb=(x,y)=>L.push({t:'o',x,y,w:1,h:1});
let x=18;
// Section 1: intro singles
for(let i=0;i<6;i++){sp(x);x+=10;}
sp(x);sp(x+1);x+=12;sp(x);sp(x+1);x+=12;
// Section 2: blocks and steps
bl(x,0,3,1);sp(x+5);bl(x+7,0,3,2);bl(x+10,0,1,1);x+=16;
for(let i=0;i<4;i++){bl(x,0,2,1+i%2*1);sp(x+2);sp(x+3);x+=7;}
x+=4;sp(x);sp(x+1);sp(x+2);x+=10;
// Section 3: pads
pad(x);sp(x+3);sp(x+4);sp(x+5);sp(x+6);x+=14;
pad(x);bl(x+6,2,4,1);sp(x+9,3);x+=14;
for(let i=0;i<3;i++){sp(x);x+=5;sp(x);sp(x+1);x+=8;}
// Section 4: platforms over spike pits
bl(x,0,3,1);for(let i=3;i<15;i++)sp(x+i);bl(x+6,2,3,1);bl(x+12,3,3,1);bl(x+15,0,3,1);x+=24;
// Section 5: orbs
sp(x);sp(x+1);sp(x+2);orb(x+2,2.3);sp(x+3);sp(x+4);sp(x+5);sp(x+6);x+=14;
for(let i=0;i<3;i++){sp(x);sp(x+1);sp(x+2);orb(x+2,2.2);sp(x+3);sp(x+4);sp(x+5);x+=13;}
x+=4;
// Section 6: staircase
for(let i=0;i<5;i++){bl(x+i*3,0,3,i+1);} for(let i=0;i<5;i++)sp(x+15+i);bl(x+18,2,4,1);x+=28;
// Section 7: rhythm doubles
for(let i=0;i<6;i++){sp(x);if(i%2)sp(x+1);x+=i%3==2?9:7;}
// Section 8: tunnel ceiling
bl(x,0,20,1);for(let i=0;i<4;i++)sp(x+4+i*4,1);bl(x,5,20,1);x+=26;
// Section 9: pad + orb chain
pad(x);for(let i=1;i<20;i++)sp(x+i);orb(x+8,3.6);orb(x+14,3);bl(x+20,0,3,1);x+=28;
// Section 9b: mid-break + block hops
x+=6;for(let i=0;i<6;i++){bl(x,0,2,1+(i%3));sp(x+3);x+=8;}
// Section 9c: orb ladder
for(let i=0;i<4;i++){sp(x);sp(x+1);sp(x+2);orb(x+2,2.2);sp(x+3);sp(x+4);sp(x+5);x+=11;}
// Section 9d: floating platforms with pads
pad(x);for(let i=1;i<18;i++)sp(x+i);bl(x+6,3,3,1);bl(x+12,3,3,1);bl(x+18,0,3,1);x+=26;
for(let i=0;i<8;i++){sp(x);if(i%3==1)sp(x+1);x+=7;}
// Section 10: finale gauntlet
for(let i=0;i<5;i++){bl(x,0,2,1);sp(x+2);sp(x+3);bl(x+4,0,2,2);sp(x+6);sp(x+7);x+=12;}
pad(x);sp(x+2);sp(x+3);sp(x+4);sp(x+5);sp(x+6);x+=12;
for(let i=0;i<4;i++){sp(x);sp(x+1);x+=6;}
x+=8;
const LEVEL_END=x+6;
const DURATION=LEVEL_END/SPEED;

// ---------- State ----------
let P,attempts=1,state='start',practice=false,checkpoints=[],dead=0,parts=[],camX=0,best=0,holding=false,orbUsed=new Set(),levelTime=0,paused=false;
function reset(){
  const cp=practice&&checkpoints.length?checkpoints[checkpoints.length-1]:null;
  P=cp?{...cp}:{x:0,y:0,vy:0,rot:0,ground:true};
  orbUsed=new Set();parts=parts.filter(p=>p.k);dead=0;
  levelTime=P.x/SPEED; startMusic(levelTime);
}
// ---------- Audio ----------
let AC=null,master=null,muted=false,musicT0=0,nextBeat=0,schedTimer=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.35;master.connect(AC.destination);}catch(e){}}
function noiseBuf(){const b=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
let NB=null;
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(master);o.start(t);o.stop(t+.26);}
function hat(t,v=.25,len=.05){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+len+.01);}
function snare(t){hat(t,.5,.18);const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=190;g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g);g.connect(master);o.start(t);o.stop(t+.12);}
function tone(t,f,len,type='sawtooth',v=.12){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1800;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(fl);fl.connect(g);g.connect(master);o.start(t);o.stop(t+len+.02);}
const ROOTS=[45,41,48,43]; const mf=n=>440*Math.pow(2,(n-69)/12);
const ARP=[0,7,12,15,12,7,3,7];
function playStep(i,t){ // i = 16th-note index
  const bar=Math.floor(i/16),s=i%16,sec=Math.floor(bar/8),root=ROOTS[Math.floor(bar/2)%4];
  if(s%4==0)kick(t);
  if(s==4||s==12){if(sec>0)snare(t);}
  if(s%2==1)hat(t,.15);
  if(s%4==2)tone(t,mf(root-12),.18,'square',.13);
  if(sec>=1)tone(t,mf(root+12+ARP[s%8]),.12,'sawtooth',sec>=3?.07:.05);
  if(sec>=2&&s==0)tone(t,mf(root+24),BEAT*3.5,'triangle',.05);
}
function startMusic(fromSec){
  if(!AC)return; if(AC.state==='suspended')AC.resume();
  clearInterval(schedTimer);
  const step=BEAT/4; let idx=Math.ceil(fromSec/step); musicT0=AC.currentTime+.05-fromSec;
  nextBeat=idx;
  schedTimer=setInterval(()=>{if(muted||paused||state!=='play'||dead)return;
    while(musicT0+nextBeat*step<AC.currentTime+.12){const t=musicT0+nextBeat*step;if(t>=AC.currentTime-.02)playStep(nextBeat,t);nextBeat++;}},25);
}
function sfxDie(){if(!AC||muted)return;const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=NB;const g=AC.createGain();g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);s.connect(g);g.connect(master);s.start(t);s.stop(t+.4);}

// ---------- Input ----------
function press(){initAudio();if(AC&&!NB)NB=noiseBuf();holding=true;if(state==='play'&&!paused)tryJump(true);}
function release(){holding=false;}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat)press();}
  if(e.code==='Escape'||e.code==='KeyP')togglePause();
  if(e.code==='KeyZ'&&practice&&state==='play')placeCP();});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')release();});
cv.addEventListener('pointerdown',e=>{e.preventDefault();press();});
addEventListener('pointerup',release);addEventListener('pointercancel',release);
let jumpBuffered=false;
function tryJump(fresh){
  if(dead)return;
  // orbs
  for(const o of L)if(o.t==='o'&&!orbUsed.has(o)&&fresh&&Math.abs(o.x+.5-(P.x+.5))<1.1&&Math.abs(o.y+.5-(P.y+.5))<1.2){orbUsed.add(o);P.vy=ORBV;P.ground=false;burst(o.x+.5,o.y+.5,'#3fe08a',10,8,true);return;}
  if(P.ground){P.vy=JV;P.ground=false;}
}
function placeCP(){if(P.ground)checkpoints.push({...P});}

// ---------- Particles ----------
function burst(x,y,c,n,sp=8,lf=false){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6+Math.random()*.5,c,s:lf?.25:.12+Math.random()*.2,leaf:lf});}}

// ---------- Update ----------
function die(){if(dead)return;dead=performance.now();sfxDie();burst(P.x+.5,P.y+.5,'#e0192e',30,14);burst(P.x+.5,P.y+.5,'#111',20,10);burst(P.x+.5,P.y+.5,'#2fbf6a',16,9,true);burst(P.x+.5,P.y+.5,'#d4a437',10,8,true);clearInterval(schedTimer);
  setTimeout(()=>{if(state!=='play')return;attempts++;updAtt();reset();},650);}
function updAtt(){document.getElementById('att').textContent='Attempt '+attempts+(practice?' · practice':'');}
function update(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=12*dt;p.l-=dt;}parts=parts.filter(p=>p.l>0);
  if(state!=='play'||paused||dead)return;
  levelTime+=dt;
  const px0=P.x,py0=P.y;
  P.x+=SPEED*dt;
  P.vy-=G*dt; if(P.vy<-40)P.vy=-40;
  P.y+=P.vy*dt;
  P.ground=false;
  if(P.y<=0){P.y=0;P.vy=0;P.ground=true;}
  for(const o of L){
    if(o.x>P.x+2)break;
    if(o.x+o.w<P.x-1)continue;
    if(o.t==='b'){
      if(P.x+1>o.x&&P.x<o.x+o.w&&P.y<o.y+o.h&&P.y+1>o.y){
        if(py0>=o.y+o.h-.35&&P.vy<=0){P.y=o.y+o.h;P.vy=0;P.ground=true;}
        else if(py0+1<=o.y+.25&&P.vy>0){die();return;} // head bonk = die (GD style)
        else {die();return;}
      }
    } else if(o.t==='s'){
      if(P.x+.8>o.x+.35&&P.x+.2<o.x+.65&&P.y+.15<o.y+.6&&P.y+.85>o.y+.05){die();return;}
    } else if(o.t==='p'){
      if(P.x+1>o.x&&P.x<o.x+1&&P.y<o.y+.4&&P.vy<=0){P.vy=PADV;P.ground=false;burst(o.x+.5,o.y+.3,'#f5b942',12,8,true);}
    }
  }
  if(P.ground){P.rot=Math.round(P.rot/(Math.PI/2))*(Math.PI/2);if(holding)tryJump(false);}
  else P.rot+=dt*Math.PI*1.9*Math.sign(SPEED);
  if(Math.random()<.5&&P.ground)parts.push({x:P.x,y:P.y+.1,vx:-2,vy:1+Math.random(),l:.3,c:'#d4a437',s:.1});
  const pc=Math.min(100,P.x/LEVEL_END*100);best=Math.max(best,pc);
  document.getElementById('fill').style.width=pc+'%';document.getElementById('pct').textContent=Math.floor(pc)+'%';
  if(P.x>=LEVEL_END){state='win';clearInterval(schedTimer);document.getElementById('winTxt').textContent=`Completed in ${attempts} attempt${attempts>1?'s':''}${practice?' (practice)':''}.`;document.getElementById('win').classList.remove('hide');}
}

// ---------- Render (dusky grimoire theme, original art) ----------
const hue=()=>0;
function sx(x){return (x-camX)*T+W*.28;}
function groundY(){return H*.72;}
function sy(y){return groundY()-y*T;}
function castle(x,base,s,col){ctx.fillStyle=col;ctx.beginPath();
  ctx.rect(x,base-s*1.2,s*.5,s*1.2);ctx.rect(x+s*1.5,base-s*1.4,s*.5,s*1.4);ctx.rect(x+s*.5,base-s*.8,s,s*.8);ctx.rect(x+s*.85,base-s*1.9,s*.3,s*1.1);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-s*.05,base-s*1.2);ctx.lineTo(x+s*.25,base-s*1.65);ctx.lineTo(x+s*.55,base-s*1.2);
  ctx.moveTo(x+s*1.45,base-s*1.4);ctx.lineTo(x+s*1.75,base-s*1.9);ctx.lineTo(x+s*2.05,base-s*1.4);
  ctx.moveTo(x+s*.8,base-s*1.9);ctx.lineTo(x+s,base-s*2.5);ctx.lineTo(x+s*1.2,base-s*1.9);ctx.fill();
  ctx.fillStyle='#f5b94288';ctx.fillRect(x+s*.18,base-s*.9,s*.12,s*.18);ctx.fillRect(x+s*1.68,base-s*1.1,s*.12,s*.18);ctx.fillRect(x+s*.95,base-s*1.6,s*.1,s*.16);}
function tree(x,base,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+s*.5,base-s*2);ctx.lineTo(x+s,base);ctx.fill();ctx.beginPath();ctx.moveTo(x+s*.1,base-s*.8);ctx.lineTo(x+s*.5,base-s*2.4);ctx.lineTo(x+s*.9,base-s*.8);ctx.fill();}
function leaf(x,y,r,rot,c){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=c;for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.arc(-r*.45,-r*.45,r*.5,0,7);ctx.arc(r*.45,-r*.45,r*.5,0,7);ctx.fill();}ctx.restore();}
function clover(x,y,r,c){ctx.save();ctx.translate(x,y);ctx.fillStyle=c;for(let i=0;i<3;i++){ctx.rotate(Math.PI*2/3);ctx.beginPath();ctx.arc(0,-r*.55,r*.42,0,7);ctx.fill();}ctx.fillRect(-r*.06,0,r*.12,r*.9);ctx.restore();}
function swirl(x,y,r,t,a){ctx.save();ctx.translate(x,y);ctx.rotate(t);for(let k=0;k<3;k++){ctx.rotate(Math.PI*2/3);ctx.beginPath();for(let i=0;i<=20;i++){const q=i/20,ang=q*4,rr=r*q;ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);}ctx.strokeStyle=k%2?`rgba(200,20,40,${a})`:`rgba(0,0,0,${a*1.4})`;ctx.lineWidth=3;ctx.stroke();}ctx.restore();}
function render(now){
  const pulse=AC&&state==='play'&&!dead?Math.max(0,1-(((AC.currentTime-musicT0)%BEAT)/BEAT)*3):0;
  if(P&&!dead)camX=P.x;
  const GY=groundY();
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#0b0607');g.addColorStop(.55,'#3a0d12');g.addColorStop(1,`hsl(36,70%,${22+pulse*6}%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // moon + anti-magic sky swirl
  const mx=W*.78,my=GY*.28;ctx.fillStyle='#f3d27a';ctx.shadowColor='#f5b942';ctx.shadowBlur=40;ctx.beginPath();ctx.arc(mx,my,T*1.4,0,7);ctx.fill();ctx.shadowBlur=0;
  swirl(mx,my,T*3.2,now/2500,.22+pulse*.2);
  ctx.fillStyle='#f3d27a66';for(let i=0;i<40;i++){const xx=((i*137.5-camX*T*.03)%W+W)%W,yy=(i*71)%(GY*.5);ctx.fillRect(xx,yy,1.5,1.5);}
  // far castles
  for(let i=0;i<6;i++){const s=T*2.4,span=W+s*4;const xx=((i*span/6-camX*T*.1)%span+span)%span-s*2;castle(xx,GY-T*1.2,s,'#1c0a10');}
  // mid forest
  for(let i=0;i<22;i++){const s=T*(1+(i*7)%3*.3),span=W+T*4;const xx=((i*span/22-camX*T*.35)%span+span)%span-T*2;tree(xx,GY,s*1.2,'#0f2418');}
  // near forest
  for(let i=0;i<12;i++){const s=T*1.6,span=W+T*6;const xx=((i*span/12+40-camX*T*.6)%span+span)%span-T*3;tree(xx,GY+4,s,'#07130c');}
  // ground: dark stone with gold trim
  ctx.fillStyle='#120809';ctx.fillRect(0,GY,W,H-GY);
  ctx.strokeStyle='#d4a437';ctx.lineWidth=3;ctx.shadowColor='#f5b942';ctx.shadowBlur=10+pulse*12;ctx.beginPath();ctx.moveTo(0,GY);ctx.lineTo(W,GY);ctx.stroke();ctx.shadowBlur=0;
  ctx.strokeStyle='#d4a43722';ctx.lineWidth=1;const off=((camX*T)%(T*2)+T*2)%(T*2);
  for(let r=0;r<6;r++){const yy=GY+T*.7*(r+1);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();for(let xx=-off+(r%2)*T;xx<W;xx+=T*2){ctx.beginPath();ctx.moveTo(xx,yy-T*.7);ctx.lineTo(xx,yy);ctx.stroke();}}
  const minX=camX-W*.28/T-2,maxX=camX+W/T;
  for(const o of L){if(o.x+o.w<minX)continue;if(o.x>maxX)break;
    const X=sx(o.x),Y=sy(o.y);
    if(o.t==='b'){ctx.fillStyle='#24140f';ctx.fillRect(X,Y-o.h*T,o.w*T,o.h*T);
      ctx.strokeStyle='#00000088';ctx.lineWidth=1;for(let j=0;j<o.h*2;j++){const yy=Y-j*T/2;ctx.beginPath();ctx.moveTo(X,yy);ctx.lineTo(X+o.w*T,yy);ctx.stroke();for(let i=(j%2)*.5;i<o.w;i+=1){ctx.beginPath();ctx.moveTo(X+i*T,yy);ctx.lineTo(X+i*T,yy-T/2);ctx.stroke();}}
      ctx.strokeStyle='#d4a437';ctx.lineWidth=2;ctx.shadowColor='#f5b942';ctx.shadowBlur=6;ctx.strokeRect(X+1,Y-o.h*T+1,o.w*T-2,o.h*T-2);ctx.shadowBlur=0;}
    else if(o.t==='s'){ // jagged anti-magic thorn
      ctx.beginPath();ctx.moveTo(X+2,Y);ctx.lineTo(X+T*.22,Y-T*.35);ctx.lineTo(X+T*.3,Y-T*.3);ctx.lineTo(X+T*.42,Y-T*.7);ctx.lineTo(X+T*.48,Y-T*.62);ctx.lineTo(X+T*.55,Y-T*.98);
      ctx.lineTo(X+T*.62,Y-T*.6);ctx.lineTo(X+T*.7,Y-T*.66);ctx.lineTo(X+T*.75,Y-T*.32);ctx.lineTo(X+T*.82,Y-T*.38);ctx.lineTo(X+T-2,Y);ctx.closePath();
      ctx.fillStyle='#050203';ctx.fill();ctx.strokeStyle='#e0192e';ctx.lineWidth=2;ctx.shadowColor='#ff1a33';ctx.shadowBlur=10+pulse*8;ctx.stroke();ctx.shadowBlur=0;}
    else if(o.t==='p'){ctx.fillStyle='#f5b942';ctx.shadowColor='#f5b942';ctx.shadowBlur=16;ctx.beginPath();ctx.ellipse(X+T/2,Y-T*.12,T*.45,T*.15,0,Math.PI,0);ctx.fill();ctx.shadowBlur=0;clover(X+T/2,Y-T*.5,T*.18,'#2fbf6a');}
    else if(o.t==='o'){const used=orbUsed.has(o);const r=T*.32*(1+.12*Math.sin(now/120));const cx=X+T/2,cy=Y-T/2;
      const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.6);rg.addColorStop(0,used?'#555':'#eaffd0');rg.addColorStop(.4,used?'#333':'#3fe08acc');rg.addColorStop(1,'#3fe08a00');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,r*1.6,0,7);ctx.fill();ctx.strokeStyle=used?'#666':'#f5b942';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,now/300,now/300+4.5);ctx.stroke();}
  }
  {const X=sx(LEVEL_END);if(X<W+60){swirl(X+T*.3,sy(3),T*2.5,now/400,.8);ctx.strokeStyle='#f5b942';ctx.lineWidth=4;ctx.shadowColor='#f5b942';ctx.shadowBlur=20;ctx.strokeRect(X,sy(6),T*.6,T*6);ctx.shadowBlur=0;}}
  for(const c of checkpoints)clover(sx(c.x)+T/2,sy(c.y)-T*1.3,T*.3,'#2fbf6a');
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.l*2));if(p.leaf)leaf(sx(p.x),sy(p.y),p.s*T,p.l*6,p.c);else{ctx.fillStyle=p.c;ctx.fillRect(sx(p.x)-p.s*T/2,sy(p.y)-p.s*T/2,p.s*T,p.s*T);}}ctx.globalAlpha=1;
  // player: floating grimoire with clover emblem
  if(P&&!dead){const X=sx(P.x)+T/2,Y=sy(P.y)-T/2-(P.ground?Math.sin(now/180)*T*.05:0);
    swirl(X,Y,T*.9,-now/200,.35+pulse*.3);
    ctx.save();ctx.translate(X,Y);ctx.rotate(P.rot);const s=T*(1+pulse*.06);
    ctx.fillStyle='#efe2bf';ctx.fillRect(-s*.42,-s*.46,s*.9,s*.9); // pages
    ctx.fillStyle='#0d0d0d';ctx.shadowColor='#e0192e';ctx.shadowBlur=14;ctx.fillRect(-s/2,-s/2,s*.9,s);ctx.shadowBlur=0; // cover
    ctx.fillStyle='#3a0d12';ctx.fillRect(-s/2,-s/2,s*.12,s); // spine
    ctx.strokeStyle='#d4a437';ctx.lineWidth=2;ctx.strokeRect(-s*.34,-s*.42,s*.68,s*.84);
    for(const [a,b] of [[-.34,-.42],[.34,-.42],[-.34,.42],[.34,.42]]){ctx.fillStyle='#d4a437';ctx.fillRect(a*s-3,b*s-3,6,6);}
    leaf(0,0,s*.2,0,'#1a1a1a');ctx.globalAlpha=.9;clover(0,-s*.04,s*.26,'#d4a437');ctx.globalAlpha=1;
    ctx.restore();
    if(Math.random()<.3)parts.push({x:P.x+.5,y:P.y+.5,vx:-3,vy:(Math.random()-.5)*2,l:.5,c:Math.random()<.5?'#e0192e':'#111',s:.1});}
  if(dead){ctx.fillStyle=`rgba(120,0,15,${Math.max(0,.4-(now-dead)/600)})`;ctx.fillRect(0,0,W,H);}
}
let last=performance.now();
function loop(now){const dt=Math.min(1/30,(now-last)/1000);last=now;
  // sub-step for robust collisions
  const n=3;for(let i=0;i<n;i++)update(dt/n);
  render(now);requestAnimationFrame(loop);}
P={x:0,y:0,vy:0,rot:0,ground:true};
requestAnimationFrame(loop);

// ---------- UI ----------
const $=id=>document.getElementById(id);
function begin(pr){practice=pr;checkpoints=[];attempts=1;updAtt();initAudio();if(AC&&!NB)NB=noiseBuf();$('start').classList.add('hide');$('win').classList.add('hide');state='play';paused=false;holding=false;reset();refreshMenu();}
$('playBtn').onclick=()=>begin(false);$('pracBtn').onclick=()=>begin(true);$('againBtn').onclick=()=>begin(practice);
function togglePause(){if(state!=='play')return;paused=!paused;$('menu').classList.toggle('hide',!paused);if(!paused)startMusic(levelTime);else clearInterval(schedTimer);}
$('menuBtn').onclick=e=>{e.stopPropagation();togglePause();};$('menuBtn').onpointerdown=e=>e.stopPropagation();
$('resBtn').onclick=togglePause;
function refreshMenu(){$('togPrac').textContent='Practice: '+(practice?'on':'off');$('muteBtn').textContent='Sound: '+(muted?'off':'on');}
$('togPrac').onclick=()=>{practice=!practice;checkpoints=[];refreshMenu();updAtt();};
$('muteBtn').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.35;refreshMenu();};
$('restartBtn').onclick=()=>{checkpoints=[];attempts++;updAtt();paused=false;$('menu').classList.add('hide');reset();};
// practice: auto checkpoint every ~4s on ground
setInterval(()=>{if(practice&&state==='play'&&!paused&&!dead&&P.ground&&(!checkpoints.length||P.x-checkpoints[checkpoints.length-1].x>35))placeCP();},300);
window.__game={get P(){return P},LEVEL_END,DURATION,BUILD};
</script></body></html>
